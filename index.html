<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<title>Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow phone column, sticky top bar with wallet switch, bottom tab bar; summary first, detail below. */
:root{
  --bg:#eef0f3; --card:#ffffff; --ink:#14171c; --muted:#667080; --line:#dde1e7;
  --accent:#2b4fd8; --accent-soft:#e6ebff; --good:#12804a; --good-soft:#e3f4ea; --bad:#c23a2b; --bad-soft:#fbe9e6; --warn:#a86a00; --warn-soft:#fff3d6;
  --holdiit:#7a4b1f; --holdiit-soft:#f5ece2; --gold:#9a7400; --gold-soft:#fff4cc;
  --hl:#ffd43b; --hl-ink:#1f1a00; --day:#fff3bf; --day-ink:#5a4700;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --card:#181b21; --ink:#eef0f4; --muted:#9aa3b2; --line:#2a2f38;
  --accent:#7d98ff; --accent-soft:#222b4a; --good:#4fcf8a; --good-soft:#13291d; --bad:#ff7f6e; --bad-soft:#331915; --warn:#f0b84a; --warn-soft:#2e2412;
  --holdiit:#e0b184; --holdiit-soft:#2c2119; --gold:#ffd43b; --gold-soft:#2e2808; --hl:#ffd43b; --hl-ink:#1f1a00; --day:#3a3210; --day-ink:#ffe066; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --card:#181b21; --ink:#eef0f4; --muted:#9aa3b2; --line:#2a2f38;
  --accent:#7d98ff; --accent-soft:#222b4a; --good:#4fcf8a; --good-soft:#13291d; --bad:#ff7f6e; --bad-soft:#331915; --warn:#f0b84a; --warn-soft:#2e2412;
  --holdiit:#e0b184; --holdiit-soft:#2c2119; --gold:#ffd43b; --gold-soft:#2e2808; --hl:#ffd43b; --hl-ink:#1f1a00; --day:#3a3210; --day-ink:#ffe066; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between;padding-top:max(14px,env(safe-area-inset-top))}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.h button[aria-pressed="true"].hb{background:var(--holdiit);color:#fff}
nav.tabs{position:fixed;bottom:0;left:0;right:0;padding-bottom:env(safe-area-inset-bottom);z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs a{flex:1;text-align:center;padding:10px 0 12px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
h2{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--hl-ink);background:var(--hl);display:table;padding:4px 10px;border-radius:7px;margin:20px 0 8px;font-weight:700}
h3{margin:0;font-size:16px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.seg button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.kinds{display:flex;flex-wrap:wrap;gap:7px;margin:-2px 0 2px}

.kinds::-webkit-scrollbar{display:none}
.kinds button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;text-align:center;font-weight:600;cursor:pointer}
.kinds button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ck{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:4px 10px}
.ckr{display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.ckr:last-child{border-bottom:0}
.ckb{margin-top:9px;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;flex:none;display:grid;place-items:center;cursor:pointer;color:transparent;padding:0;transition:background .12s}
.ckr.on .ckb{background:var(--good);border-color:var(--good);color:#fff}
.ckm{flex:1;min-width:0}
.ckc{font-size:13px;color:var(--muted);padding:0 0 12px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ckc:empty{display:none}
.ckc.warn{color:var(--warn)}
.ckc b{color:var(--ink);font-family:var(--f-num)}
.ckc b.cin{color:var(--good)}
.ckt{width:100%;border:0;background:none;font:16px/1.4 var(--f-num);padding:11px 0;min-width:0;outline:none!important;box-shadow:none!important;color:var(--ink)}
.ckr.on .ckt{color:var(--good);font-weight:600}
.ckt::placeholder{color:var(--muted);opacity:.6}
textarea#quick{width:100%;min-height:118px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;font:15px/1.5 var(--f-num)}
input[type=date],input[type=text],input[type=number],select{border:1px solid var(--line);border-radius:9px;background:var(--card);padding:8px 10px;min-width:0}
.mic{width:44px;height:44px;border-radius:50%;padding:0;display:grid;place-items:center}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.pv{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--card)}
.pv.flag{border-color:var(--warn);background:var(--warn-soft)}
.pv .src{grid-column:1/-1;font:12.5px var(--f-num);color:var(--muted)}
.pv .f{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.pv .f input,.pv .f select{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.in{background:var(--good-soft);color:var(--good)} .pill.out{background:var(--line);color:var(--ink)}
.pill.h{background:var(--holdiit-soft);color:var(--holdiit)} .pill.s{background:var(--gold-soft);color:var(--gold)} .pill.owe{background:var(--warn-soft);color:var(--warn)} .pill.late{background:var(--bad-soft);color:var(--bad)}
.toggle{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.toggle button{border:0;background:var(--card);padding:7px 10px;font-size:13px;font-weight:600;cursor:pointer;flex:1}
.toggle button[aria-pressed="true"].tin{background:var(--good);color:#fff}
.toggle button[aria-pressed="true"].tout{background:var(--ink);color:var(--bg)}
.toggle button[aria-pressed="true"].te{background:var(--accent);color:#fff}
.toggle button[aria-pressed="true"].th{background:var(--holdiit);color:#fff}
.toggle button[aria-pressed="true"].ts{background:var(--gold);color:#1f1a00}
.x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);cursor:pointer;padding:0 4px}
.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line);transition:max-height .18s,opacity .18s;max-height:300px}
.sw:last-child{border-bottom:0}.sw.gone{max-height:0;opacity:0}
.swdel{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:var(--bad,#e5484d);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.sw .it{position:relative;background:var(--card,#fff);transition:transform .2s;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;cursor:pointer}
.toast .undo{margin-left:12px;background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
.list .it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:500;overflow-wrap:anywhere}
.list .it .m{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.amt{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.amt.in{color:var(--good)}
.day{font-size:12px;font-weight:700;color:var(--day-ink);background:var(--day);text-transform:uppercase;letter-spacing:.05em;padding:5px 8px;margin:10px 0 2px;border-radius:6px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .v{font:700 22px/1.15 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.03em;overflow-wrap:anywhere}
.tile.big .v{font-size:28px}
.tile .s{font-size:11.5px;color:var(--muted)}
.tile.pos{border-color:color-mix(in srgb,var(--good) 45%,var(--line))} .tile.pos .v{color:var(--good)}
.tile.neg{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))} .tile.neg .v{color:var(--bad)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid3 .tile .v{font-size:17px}
@media (max-width:400px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.monthbar{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.monthbar h1{font-size:22px;margin:0;letter-spacing:-.02em}
.arrow{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.bars .b{display:grid;grid-template-columns:120px 1fr 74px;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.bars .track{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}
.bars .fill{height:100%;background:var(--accent);border-radius:6px}
.bars .fill.job{background:var(--warn)} .bars .fill.h{background:var(--holdiit)} .bars .fill.s{background:var(--gold)}
.bars .b .amt{font-weight:600;font-size:13px}
@media (max-width:400px){.bars .b{grid-template-columns:96px 1fr 64px}}
.job{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.job:last-child{border-bottom:0}
.job.unpaid{border-left:3px solid var(--bad);padding-left:10px}
.job .nm{font-weight:600;overflow-wrap:anywhere}
.job .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.job .meta b{font-family:var(--f-num);font-weight:600;color:var(--ink)}
table.yr{width:100%;border-collapse:collapse;font-size:13px}
table.yr th{font-size:11.5px;color:var(--muted);text-align:right;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.yr th:first-child,table.yr td:first-child{text-align:left}
table.yr td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
table.yr tr.tot td{font-weight:700;border-bottom:0}
table.yr td.neg{color:var(--bad)} table.yr td.pos{color:var(--good)}
.scrollx{overflow-x:auto}
.banner{border-radius:12px;padding:10px 12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);margin:0 0 12px}
.banner.ok{background:var(--good-soft);color:var(--good)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 24px;max-height:90%;overflow:auto}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.form label.full{grid-column:1/-1}
.form input,.form select{width:100%;color:var(--ink);font-weight:400;font-size:15px}
.search{width:100%}
.toast.show{pointer-events:auto}
.ico{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center}.ico svg{width:18px;height:18px}.ico[aria-current=page]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
svg.chart{width:100%;height:auto;display:block}
.empty{padding:18px;text-align:center;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}

.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 14px}
.phead h1{font-size:24px;margin:0;letter-spacing:-.02em}
.lead{margin:2px 0 0;color:var(--muted);font-size:14px}
.cols{display:block}
.cols>div>h2.first{margin-top:20px}
@media (min-width:900px){
  body{padding-left:210px}
  nav.tabs{top:0;bottom:0;right:auto;width:210px;border-top:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding-top:72px}
  nav.tabs .in{flex-direction:column;gap:2px;padding:0 10px}
  nav.tabs a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:15px;border-radius:10px}
  nav.tabs a[aria-current="page"]{background:var(--accent-soft)}
  header.top{max-width:1180px;padding:18px 32px 12px}
  .brand{font-size:22px}
  .wrap{max-width:1180px;padding:0 32px 48px}
  .hero{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .tile.big .v{font-size:34px}
  .grid3{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
  .cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
  .cols>div>h2:first-child,.cols>div>h2.first{margin-top:20px}
  .bars .b{grid-template-columns:170px 1fr 90px}
  .sheet{align-items:center}
  .sheet .panel{border-radius:18px;max-width:640px}
  .toast{bottom:32px}
  .monthbar{justify-content:flex-start;gap:16px}
}
@media (min-width:900px) and (max-width:1150px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hint code{font-family:var(--f-num);background:var(--bg);padding:1px 5px;border-radius:5px;color:var(--ink)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Finance<small id="syncState">Loading…</small></div>
</header>
<main class="wrap" id="app"></main>
<nav class="tabs" aria-label="Sections"><div class="in">
  <a href="#add" data-v="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</a>
  <a href="#month" data-v="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Month</a>
  <a href="#jobs" data-v="jobs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Jobs</a>
  <a href="#savings" data-v="savings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17h16l-2-5H6zM7 12l1.5-4h7L17 12M3 21h18"/></svg>Savings</a>
  <a href="#year" data-v="year"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Year</a>
  <a href="#more" data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</a>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="panel" id="sheetPanel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>


<script src="vendor/supabase.js"></script>
<script src="vendor/xlsx.full.min.js" defer></script>
<script src="app.js?v=33"></script>
</body>
</html>
